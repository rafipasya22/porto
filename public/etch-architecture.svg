<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Etch system architecture">
<title>Etch system architecture</title>
<defs>
  <marker id="head-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker>
  <marker id="head-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/></marker>
</defs>

<!-- Frontend boundary -->
<rect x="40" y="55" width="330" height="350" rx="14" fill="#2a2a2a" stroke="#404040" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="58" y="83" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#f87171">FRONTEND · VUE 3 · VERCEL</text>

<rect x="70" y="100" width="270" height="65" rx="10" fill="#333333" stroke="#4b4b4b" stroke-width="1.5"/>
<text x="205" y="127" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Editor UI</text>
<text x="205" y="147" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af">Monaco · block editor · board selector</text>

<rect x="70" y="190" width="270" height="60" rx="10" fill="#333333" stroke="#4b4b4b" stroke-width="1.5"/>
<text x="205" y="216.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Library Manager</text>
<text x="205" y="236.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af">search · install · manage libraries</text>

<rect x="70" y="275" width="270" height="85" rx="10" fill="#333333" stroke="#4b4b4b" stroke-width="1.5"/>
<text x="205" y="307" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Web Serial Flasher</text>
<text x="205" y="328" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af">downloads firmware build</text>
<text x="205" y="346" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af">and flashes connected board</text>

<!-- Backend boundary -->
<rect x="470" y="55" width="340" height="315" rx="14" fill="#2a2a2a" stroke="#404040" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="488" y="83" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#f87171">BACKEND · FASTAPI · DOCKER</text>

<rect x="500" y="105" width="280" height="80" rx="10" fill="#3b1f1f" stroke="#b91c1c" stroke-width="1.5"/>
<text x="640" y="133" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Compile API</text>
<text x="640" y="153" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af">arduino-cli · AVR + ESP32 cores</text>
<text x="640" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af">builds firmware · returns firmware ID</text>

<rect x="500" y="215" width="280" height="55" rx="10" fill="#333333" stroke="#4b4b4b" stroke-width="1.5"/>
<text x="640" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Arduino Library API</text>
<text x="640" y="256" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af">search · install · uninstall</text>

<rect x="500" y="295" width="280" height="55" rx="10" fill="#333333" stroke="#4b4b4b" stroke-width="1.5"/>
<text x="640" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">clangd Language Server</text>
<text x="640" y="336" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af">editor diagnostics · autocomplete</text>

<!-- Hardware -->
<rect x="900" y="300" width="250" height="80" rx="10" fill="#333333" stroke="#4b4b4b" stroke-width="1.5"/>
<text x="1025" y="333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Arduino / ESP32 Board</text>
<text x="1025" y="353" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af">microcontroller</text>

<!-- Compile request and firmware response -->
<path d="M 370,125 L 500,125" fill="none" stroke="#ef4444" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-red)"/>
<text x="435" y="116" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1d5db">compile</text>
<path d="M 500,165 L 370,165" fill="none" stroke="#ef4444" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-red)"/>
<text x="435" y="184" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1d5db">firmware ID</text>

<!-- Library API -->
<path d="M 370,220 L 500,242" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linejoin="round" marker-start="url(#head-gray)" marker-end="url(#head-gray)"/>
<text x="435" y="211" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1d5db">HTTPS</text>

<!-- Language server -->
<path d="M 370,310 L 500,322" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linejoin="round" marker-start="url(#head-gray)" marker-end="url(#head-gray)"/>
<text x="435" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1d5db">WSS</text>

<!-- Direct browser-to-board serial connection -->
<path d="M 340,350 L 390,350 L 390,435 L 860,435 L 860,365 L 900,365" fill="none" stroke="#ef4444" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-red)"/>
<text x="625" y="457" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1d5db">Web Serial · direct browser-to-board flashing</text>
</svg>
