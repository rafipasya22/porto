<rect x="30" y="130" width="180" height="140" rx="10" fill="#333333" stroke="#4b4b4b" stroke-width="1.5"/><text x="120.0" y="188.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Mobile app</text><text x="120.0" y="208.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af">React Native (Expo)</text><text x="120.0" y="225.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af">TypeScript</text><rect x="330" y="130" width="180" height="140" rx="10" fill="#333333" stroke="#4b4b4b" stroke-width="1.5"/><text x="420.0" y="188.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">FastAPI</text><text x="420.0" y="208.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af">POST /jobs</text><text x="420.0" y="225.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af">GET /jobs/{id}</text><path d="M 210,165 L 330,165" fill="none" stroke="#ef4444" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-red)"/><text x="270" y="156" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1d5db">upload</text><path d="M 330,200 L 210,200" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-gray)"/><text x="270" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1d5db">job ID</text><path d="M 210,245 L 330,245" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-gray)" marker-start="url(#head-gray)"/><text x="270" y="263" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1d5db">poll / results</text><rect x="570" y="150" width="120" height="100" rx="10" fill="#333333" stroke="#4b4b4b" stroke-width="1.5