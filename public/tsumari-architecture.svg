fffff">Embeddings</text><text x="960.0" y="285.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af">chapter the transcript</text><path d="M 960,300 L 960,322" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-gray)"/><rect x="780" y="322" width="360" height="62" rx="10" fill="#3b1f1f" stroke="#b91c1c" stroke-width="1.5"/><text x="960.0" y="349.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">LLM (Groq)</text><text x="960.0" y="369.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af">chapter titles + summaries</text><path d="M 690,200 L 750,200" fill="none" stroke="#ef4444" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-red)"/><rect x="330" y="340" width="180" height="60" rx="10" fill="#333333" stroke="#4b4b4b" stroke-width="1.5"/><text x="420.0" y="366.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Supabase</text><text x="420.0" y="386.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af">database and storage</text><path d="M 420,270 L 420,340" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#head-gray)" marker-start="url(#head-gray)"/>
