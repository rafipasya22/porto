  <text x="640" y="256" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af" style="white-space: pre;">search · install · uninstall</text>
  <rect x="500" y="295" width="280" height="55" rx="10" fill="#333333" stroke="#4b4b4b" stroke-width="1.5"/>
