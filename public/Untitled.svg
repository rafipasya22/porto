<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Etch system architecture">
  <title>Etch system architecture</title>
  <defs>
    <marker id="head-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="head-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>
  <rect x="40" y="55" width="330" height="350" rx="14" fill="#2a2a2a" stroke="#404040" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="58" y="83" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#f87171" style="white-space: pre;">FRONTEND · VUE 3 · VERCEL</text>
  <rect x="70" y="100" width="270" height="65" rx="10" fill="#333333" stroke="#4b4b4b" stroke-width="1.5"/>
  <text x="205" y="127" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" style="white-space: pre;">Editor UI</text>
  <text x="205" y="147" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af" style="white-space: pre;">Monaco · block editor · board selector</text>
  <rect x="70" y="190" width="270" height="60" rx="10" fill="#333333" stroke="#4b4b4b" stroke-width="1.5"/>
  <text x="205" y="216.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" style="white-space: pre;">Library Manager</text>
  <text x="205" y="236.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af" style="white-space: pre;">search · install · manage libraries</text>
  <rect x="70" y="275" width="270" height="85" rx="10" fill="#333333" stroke="#4b4b4b" stroke-width="1.5"/>
