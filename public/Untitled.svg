  <text x="205" y="346" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af" style="white-space: pre;">and flashes connected board</text>
  <rect x="470" y="55" width="340" height="315" rx="14" fill="#2a2a2a" stroke="#404040" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="488" y="83" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#f87171" style="white-space: pre;">BACKEND · FASTAPI · DOCKER</text>
  <rect x="500" y="105" width="280" height="80" rx="10" fill="#3b1f1f" stroke="#b91c1c" stroke-width="1.5"/>
