  <text x="1025" y="353" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af" style="white-space: pre;">microcontroller</text>
  <path d="M 370,125 L 500,125" fill="none" stroke="#ef4444" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-red)"/>
  <text x="435" y="116" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1d5db" style="white-space: pre;">compile</text>
  <path d="M 500,165 L 370,165" fill="none" stroke="#ef4444" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-red)"/>
  <text x="435" y="184" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1d5db" style="white-space: pre;">firmware ID</text>
  <path d="M 368.981 244.264 L 498.981 244.264" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linejoin="round" marker-start="url(#head-gray)" marker-end="url(#head-gray)"/>
  <path d="M 370,322 L 500,322" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linejoin="round" marker-start="url(#head-gray)" marker-end="url(#head-gray)"/>
  <path d="M 370.307 349.688 L 390 350 L 390 435 L 860 435 L 859.66 332.684 L 897.278 332.344" fill="none" stroke="#ef4444" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-red)"/>
  <text x="625" y="457" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1d5db" style="white-space: pre;">Web Serial · direct browser-to-board flashing</text>
